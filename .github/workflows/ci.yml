name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # golangci-lint v2 requires the action v9+; pinning a v2 release keeps
      # the Go-version check satisfied without depending on how "latest"
      # happens to resolve.
      - name: golangci-lint (root module)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: ./...

      - name: golangci-lint (tests module)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: tests
          args: ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Download modules
        run: |
          go mod download
          cd tests && go mod download

      - name: Build
        run: |
          go build ./...
          cd tests && go build ./...

      - name: Vet
        run: |
          go vet ./...
          cd tests && go vet ./...

      # Integration tests auto-skip when DBRO_POSTGRES_DSN / DBRO_MYSQL_DSN
      # are unset, so this job covers SQLite in-memory tests without needing
      # database services. The test-integration job below runs the full suite
      # with PostgreSQL and MySQL.
      - name: Test
        run: |
          go test ./...
          cd tests && go test ./...

  test-race:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Download modules
        run: |
          go mod download
          cd tests && go mod download

      - name: Test (race)
        run: |
          go test -race ./...
          cd tests && go test -race ./...

  # Runs integration tests against real PostgreSQL and MySQL instances
  # using GitHub Actions service containers. The tests module's integration
  # tests skip themselves when DSN env vars are unset, so the test/test-race
  # jobs above only exercise SQLite in-memory tests.
  test-integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: dbro
          POSTGRES_PASSWORD: dbro
          POSTGRES_DB: dbro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dbro -d dbro_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dbro_test
          MYSQL_USER: dbro
          MYSQL_PASSWORD: dbro
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u dbro -pdbro"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    env:
      DBRO_POSTGRES_DSN: "host=127.0.0.1 user=dbro password=dbro dbname=dbro_test port=5432 sslmode=disable"
      DBRO_MYSQL_DSN: "dbro:dbro@tcp(127.0.0.1:3306)/dbro_test?parseTime=true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Download modules
        run: cd tests && go mod download

      - name: Integration tests
        run: cd tests && go test -v ./...

  # Official Go team action. Reports known vulnerabilities from the Go
  # vulnerability database (vuln.go.dev) that are actually reachable from
  # this module's call graph, not just present in go.sum.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false
          go-version-file: go.mod
          go-package: ./...

  # securego/gosec's own action runs gosec inside a bare Docker container
  # which doesn't fit the multi-module workspace model. Installing the
  # binary onto the runner gives gosec's type-checking source loader what
  # it needs. Findings should be fixed where real, or suppressed with an
  # inline `// #nosec Gxxx -- reason` comment where the flagged pattern is
  # safe by inspection. New findings block merges.
  gosec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: gosec (root module)
        run: gosec ./...

      - name: gosec (tests module)
        run: cd tests && gosec ./...

  # go.uber.org/nilaway, run standalone. -include-pkgs scopes analysis to
  # this module instead of every dependency NilAway can see, keeping the
  # signal-to-noise ratio sane on an existing codebase.
  nilaway:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install NilAway
        run: go install go.uber.org/nilaway/cmd/nilaway@latest

      - name: NilAway
        run: nilaway -include-pkgs="github.com/ieshan/dbro" ./...
